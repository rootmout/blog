variables:
  GIT_SUBMODULE_STRATEGY: recursive
  HUGO_VERSION: "0.93.2"

stages:
  - build

build-site:
  image: alpine:3.19
  stage: build
  before_script:
    - apk add --no-cache curl tar
    - curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /usr/local/bin hugo
  script:
    - hugo --source=src/ --destination="$CI_PROJECT_DIR/blog/"
  artifacts:
    name: "site-$CI_COMMIT_REF_SLUG"
    paths:
      - blog/
    expire_in: 3 months
